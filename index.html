<style>
/* Layout: eine Spalte, oben Spielstand, Mitte aktuelle Karte, darunter vertikaler Zeitstrahl mit Einfüge-Lücken */
:root{
  --bg:#f3f1f7; --surface:#ffffff; --ink:#1d1a26; --muted:#6b6579; --line:#dcd7e6;
  --a:#c2255c; --a-soft:#fbe3ec; --b:#1864ab; --b-soft:#dfecfa;
  --ok:#2b8a3e; --ok-soft:#e3f5e6; --bad:#c92a2a; --bad-soft:#fde5e5;
  --vinyl:#24202d;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131b; --surface:#211e2a; --ink:#f1eef7; --muted:#a59fb3; --line:#363142;
  --a:#f06595; --a-soft:#3a1d2a; --b:#4dabf7; --b-soft:#162a3d;
  --ok:#51cf66; --ok-soft:#173222; --bad:#ff6b6b; --bad-soft:#3a1c1c; --vinyl:#0b0a0f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131b; --surface:#211e2a; --ink:#f1eef7; --muted:#a59fb3; --line:#363142;
  --a:#f06595; --a-soft:#3a1d2a; --b:#4dabf7; --b-soft:#162a3d;
  --ok:#51cf66; --ok-soft:#173222; --bad:#ff6b6b; --bad-soft:#3a1c1c; --vinyl:#0b0a0f; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:800}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;font-family:var(--f-mono);font-size:.82rem;resize:vertical}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--a)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;
  background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 14px;font-size:.88rem}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}

/* Spielstand */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:14px;padding:12px 14px;border:2px solid transparent;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.team .name{font-weight:700;overflow-wrap:anywhere}
.team .count{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.team .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.team .bar i{display:block;height:100%}
.team.ta .bar i{background:var(--a)} .team.tb .bar i{background:var(--b)}
.team.active.ta{border-color:var(--a);background:var(--a-soft)}
.team.active.tb{border-color:var(--b);background:var(--b-soft)}

/* Mystery-Karte als Schallplatte */
.mystery{display:flex;gap:16px;align-items:center}
.disc{flex:0 0 92px;height:92px;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0 17%,var(--vinyl) 18% 22%,#2f2a3a 23% 24%,var(--vinyl) 25% 34%,#2f2a3a 35% 36%,var(--vinyl) 37% 50%,#2f2a3a 51% 52%,var(--vinyl) 53%);
  display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mystery .info{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}

/* Zeitstrahl */
.timeline{display:flex;flex-direction:column;gap:0}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card .yr{font-family:var(--f-mono);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.card .t{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.card .a{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.card.new{border-width:2px}
.card.new.good{border-color:var(--ok);background:var(--ok-soft)}
.card.new.wrong{border-color:var(--bad);background:var(--bad-soft)}
.slot{border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:6px;margin:6px 0;width:100%;font-weight:600;font-size:.85rem}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.slot.sel{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);padding:12px}
.gap{height:8px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtns>#play{flex:1 1 auto}

.result{border-radius:14px;padding:14px 16px;font-weight:700}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.wrong{background:var(--bad-soft);color:var(--bad)}
.win{text-align:center;padding:28px 16px}
.win .big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1.05;text-wrap:balance}
.hint{font-size:.85rem;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.duo>section{min-width:0;display:flex;flex-direction:column;gap:8px}
.colhead{color:var(--accent);font-size:1.05rem;overflow-wrap:anywhere;padding-bottom:6px;border-bottom:3px solid var(--accent)}
.duo .slot{padding:6px 4px;font-size:.8rem}
.duo .slot.sel{padding:10px 4px}
@media (max-width:560px){
  .duo .card{grid-template-columns:1fr;gap:2px;padding:8px 10px}
  .duo .card .yr{font-size:1.05rem}
  .duo .card .t{font-size:.88rem}
  .duo .card .a{font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

</head>

function startGame(){
  let pool=[];
  pool=pool.concat(PACKS[setup.pack].songs.filter(x=>!NOPREV.has(keyOf(x))));

  const deck=shuffle(pool.map(s=>({...s})));
  S={teams:[{name:setup.n1,cards:[deck.pop()]},{name:setup.n2,cards:[deck.pop()]}],
     target:setup.target,deck,current:deck.pop(),slots:[null,null],phase:"guess",ok:[null,null],round:1,tiebreak:false,winner:null};
  save(KEY_GAME,S);renderGame();
}

const audio=new Audio(); audio.preload="auto";
const pcache={}; let loadedKey=null;
const keyOf=s=>s.a+"|"+s.t;
const $=id=>document.getElementById(id);
const norm=x=>String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)|\[.*?\]/g,"").replace(/feat\..*| & .*/,"").replace(/[^a-z0-9ß ]/g," ").replace(/\s+/g," ").trim();
function jsonp(url){return new Promise((res,rej)=>{
  const cb="itcb"+Math.random().toString(36).slice(2), sc=document.createElement("script");
  const done=()=>{clearTimeout(t);delete window[cb];sc.remove()};
  const t=setTimeout(()=>{done();rej(new Error("timeout"))},12000);
  window[cb]=d=>{done();res(d)}; sc.onerror=()=>{done();rej(new Error("net"))};
  sc.src=url+"&callback="+cb; document.head.appendChild(sc);
})}
function bestMatch(results,na,nt){
  let best=null,bs=-1;
  for(const r of (results||[])){
    if(!r.previewUrl)continue;
    const ra=norm(r.artistName||""), rt=norm(r.trackName||"");
    let sc=0;
    if(ra&&(ra.includes(na)||na.includes(ra)))sc+=2;
    else if(ra&&na.split(" ").some(w=>w.length>3&&ra.includes(w)))sc+=1;
    if(rt===nt)sc+=3; else if(rt&&(rt.includes(nt)||nt.includes(rt)))sc+=2;
    if(/live|karaoke|instrumental|remix|cover|tribute/i.test((r.trackName||"")+" "+(r.collectionName||"")+" "+(r.artistName||"")))sc-=1;
    if(sc>bs){bs=sc;best=r}
  }
  return bs>=3?best.previewUrl:null;
}
let lastErr="";
async function api(u){   // 1. Weg: fetch (CORS), 2. Weg: JSONP
  let e1="";
  try{
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(u,{signal:ctl.signal,cache:"no-store"}); clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return JSON.parse(await r.text());
  }catch(e){e1=(e&&(e.name||e.message))||"fetch"}
  try{return await jsonp(u)}
  catch(e2){lastErr="F:"+e1+" J:"+(e2&&e2.message||"?");throw e2}
}
const IT="https://itunes.apple.com/search?media=music&entity=song&term=";
async function findPreview(s){
  const k=keyOf(s); if(k in pcache) return pcache[k];
  const na=norm(s.a), nt=norm(s.t); let url=null;
  try{
    url=bestMatch((await api(IT+encodeURIComponent(na+" "+nt)+"&limit=15&country=DE")).results,na,nt);
    if(!url) url=bestMatch((await api(IT+encodeURIComponent(nt)+"&limit=25&country=DE")).results,na,nt);
    if(!url) url=bestMatch((await api(IT+encodeURIComponent(na+" "+nt)+"&limit=15&country=US")).results,na,nt);
  }catch(e){url=undefined}
  if(url!==undefined){pcache[k]=url; if(url===null){NOPREV.add(k);save(KEY_NOPREV,[...NOPREV])}}
  return url;
}
const fmt=x=>{x=Math.max(0,Math.floor(x||0));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")};
function updatePlayerUI(){
  const play=$("play"); if(!play||!S||!S.current)return;
  const k=keyOf(S.current), u=pcache[k], ready=!!u&&loadedKey===k&&!!audio.src;
  play.disabled=!ready; $("restart").disabled=!ready;
  play.textContent=audio.paused?"▶ Abspielen":"⏸ Pause";
  $("disc").classList.toggle("spin",!audio.paused);
  let msg;
  const neterr=pcache.__neterr===k&&!(k in pcache);
  if(neterr){play.disabled=false;play.textContent="↻ Erneut versuchen"}
  if(!(k in pcache)) msg=neterr?"Keine Verbindung zu iTunes ("+lastErr+"). Erneut versuchen oder YouTube Music nutzen.":"Vorschau wird geladen …";
  else if(!u) msg="Keine Vorschau gefunden – nächster Song wird gesucht …";
  else if(!audio.paused) msg="Läuft · "+fmt(audio.currentTime)+" / "+fmt(audio.duration||30);
  else if(audio.currentTime>0&&!audio.ended) msg="Pausiert · "+fmt(audio.currentTime);
  else msg="Bereit · ca. 30 Sekunden";
  $("pstatus").textContent=msg;
}
["play","pause","timeupdate","ended","loadeddata"].forEach(e=>audio.addEventListener(e,updatePlayerUI));
function setupPlayer(){
  if(!$("play"))return;
  const s=S.current,k=keyOf(s);
  if(loadedKey!==k){
    audio.pause(); audio.removeAttribute("src"); audio.load(); loadedKey=k;
    findPreview(s).then(u=>{
      if(u===undefined)pcache.__neterr=k;
      if(u===null&&loadedKey===k&&S.phase==="guess"&&S.deck.length){   // keine Vorschau: still überspringen
        S.current=S.deck.pop(); S.skipped=(S.skipped||0)+1; loadedKey=null; save(KEY_GAME,S); renderGame(); return;
      }
      if(loadedKey===k&&u){audio.src=u;audio.load()}
      updatePlayerUI();
      const nx=S.deck[S.deck.length-1]; if(nx)findPreview(nx);   // nächsten Song vorladen
    });
  }
  $("play").onclick=()=>{if(pcache.__neterr===keyOf(S.current)&&!(keyOf(S.current) in pcache)){delete pcache.__neterr;loadedKey=null;setupPlayer();return}
    if(audio.paused){if(audio.ended)audio.currentTime=0;audio.play().catch(()=>{$("pstatus").textContent="Abspielen nicht möglich. YouTube Music nutzen."})}else audio.pause()};
  $("restart").onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{})};
  updatePlayerUI();
}

      const lbl=i===0?"vor "+sorted[0].y:i===sorted.length?"nach "+sorted[i-1].y:`${sorted[i-1].y}–${sorted[i].y}`;
      h+=`<button class="slot ${sel===i?"sel":""}" data-team="${ti}" data-slot="${i}" aria-pressed="${sel===i}">${sel===i?"✓ hier":"+ "+lbl}</button>`;
      if(i<sorted.length)h+=cardHTML(sorted[i]);
    }
    return h;
  }
  // Auflösung: richtige Karte ist bereits im Zeitstrahl; falsche an gewählter Stelle rot zeigen
  let list;
  if(S.ok[ti]) list=sorted.map(c=>c._r?{...c,_new:true}:c);
  else {list=[...sorted];list.splice(sel,0,{...S.current,_new:true});}
  return list.map(c=>cardHTML(c,c._new?"new "+(S.ok[ti]?"good":"wrong"):"")).join('<div class="gap"></div>');
}

function renderGame(){
  if(S.winner!=null)return renderWin();
  const both=S.slots[0]!=null&&S.slots[1]!=null;
  const res=S.phase==="reveal";
  app.innerHTML=`
  <div class="score">${S.teams.map((t,i)=>`<div class="team ${i?"tb":"ta"} ${!res&&S.slots[i]==null?"active":""}">
     <span class="name">${esc(t.name)}</span><span class="count">${t.cards.length}<span class="muted" style="font-size:.9rem"> / ${S.target}</span></span>
     <span class="bar"><i style="width:${Math.min(100,t.cards.length/S.target*100)}%"></i></span></div>`).join("")}</div>

  <section class="panel" style="--accent:var(--muted)">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <span class="label">${S.tiebreak?"Stechen · ":""}Runde ${S.round}</span><span class="hint">${S.deck.length} Songs im Stapel</span>
    </div>
    ${!res?`
      <div class="mystery">
        <div class="disc" id="disc" aria-hidden="true">?</div>
        <div class="info">
          <div class="pbtns"><button id="play" disabled>▶ Abspielen</button><button class="ghost" id="restart" disabled aria-label="Von vorn abspielen">↺</button></div>
          <div class="hint" id="pstatus" role="status">Vorschau wird geladen …</div>
          <div class="pbtns"><button class="small ghost" id="skip">Anderer Song</button><a class="small ghost btn" style="padding:8px 14px;font-size:.88rem" href="${esc(ytLink(S.current))}" target="_blank" rel="noopener">YouTube Music</a></div>
        </div>
      </div>
      <p class="hint" style="margin:0">${S.tiebreak?"Beide Teams haben das Ziel erreicht. Gewonnen hat, wer als einziges Team richtig liegt. ":""}Die Vorschau (ca. 30 Sekunden) spielt verdeckt. Beide Teams wählen eine Lücke in ihrem Zeitstrahl.</p>`
    :`<div class="label">Auflösung</div>${cardHTML(S.current)}
      <div class="row">${S.teams.map((t,i)=>`<div class="result ${S.ok[i]?"good":"wrong"}" style="flex:1 1 140px">${esc(t.name)}: ${S.ok[i]?"richtig":"falsch"}</div>`).join("")}</div>`}
  </section>

  <div class="duo">${S.teams.map((t,i)=>`<section style="${teamVars(i)}">
      <h2 class="colhead">${esc(t.name)}</h2>
      <div class="timeline">${timelineHTML(i)}</div></section>`).join("")}</div>

  ${!res
    ?`<button id="reveal" ${both?"":"disabled"} style="padding:16px">${both?"Auflösen":"Beide Teams wählen eine Lücke"}</button>`
    :`<button id="next" style="padding:16px">Nächster Song</button>`}
  <button class="ghost small" id="quit">Zum Menü</button>
  <p class="hint" style="margin:0;text-align:center">Version ${APP_VERSION}</p>`;

  app.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{const t=+b.dataset.team,v=+b.dataset.slot;S.slots[t]=S.slots[t]===v?null:v;save(KEY_GAME,S);renderGame()});
  const q=id=>document.getElementById(id);
  if(q("skip"))q("skip").onclick=()=>{if(!S.deck.length)return endByDeck();S.deck.unshift(S.current);S.current=S.deck.pop();S.slots=[null,null];save(KEY_GAME,S);renderGame()};
  if(q("reveal"))q("reveal").onclick=()=>{
    const y=S.current.y;
    S.ok=S.teams.map((t,i)=>{const s=sortedOf(t),k=S.slots[i];
      const l=k>0?s[k-1].y:-Infinity,r=k<s.length?s[k].y:Infinity;return l<=y&&y<=r});
    S.teams.forEach((t,i)=>{if(S.ok[i])t.cards.push({...S.current,_r:true})});
    S.phase="reveal";
    // Siegprüfung
    if(S.tiebreak){ if(S.ok[0]!==S.ok[1]) S.pendingWin=S.ok[0]?0:1; }
    else{
      const done=S.teams.map(t=>t.cards.length>=S.target);
      if(done[0]&&done[1]) S.tiebreak=true; else if(done[0]||done[1]) S.pendingWin=done[0]?0:1;
    }
    save(KEY_GAME,S);renderGame();window.scrollTo({top:0,behavior:"smooth"});
  };
  if(q("next"))q("next").onclick=()=>{
    S.teams.forEach(t=>t.cards.forEach(c=>delete c._r));
    if(S.pendingWin!=null){S.winner=S.pendingWin;save(KEY_GAME,S);return renderWin()}
    if(!S.deck.length)return endByDeck();
    S.current=S.deck.pop();S.slots=[null,null];S.phase="guess";S.ok=[null,null];S.round++;
    save(KEY_GAME,S);renderGame();window.scrollTo({top:0,behavior:"smooth"});
  };
  q("quit").onclick=()=>{audio.pause();renderSetup()};
  setupPlayer();
}

function endByDeck(){
  const [a,b]=S.teams.map(t=>t.cards.length);
  S.winner=a===b?-1:(a>b?0:1);save(KEY_GAME,S);renderWin("Der Stapel ist leer.");
}

function renderWin(note=""){
  const w=S.winner;
  app.innerHTML=`
  <section class="panel win" style="${w>=0?teamVars(w):""}">
    <span class="label">${note||"Spielende"}</span>
    <div class="big" style="color:var(--accent,var(--ink))">${w<0?"Unentschieden":esc(S.teams[w].name)+" gewinnt!"}</div>
    <div style="font-family:var(--f-mono);font-size:1.3rem;font-weight:700">${S.teams[0].cards.length} : ${S.teams[1].cards.length}</div>
  </section>
  ${S.teams.map((t,i)=>`<section style="${teamVars(i)};display:flex;flex-direction:column;gap:8px"><h2>${esc(t.name)}</h2>
    ${[...t.cards].sort((x,y)=>x.y-y.y).map(c=>cardHTML(c)).join("")}</section>`).join("")}
  <button id="again" style="padding:16px">Neues Spiel</button>`;
  document.getElementById("again").onclick=()=>{setup.n1=S.teams[0].name;setup.n2=S.teams[1].name;S=null;save(KEY_GAME,null);renderSetup()};
}

if(S&&S.winner!=null){S=null}
renderSetup();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

</body>
</html>
